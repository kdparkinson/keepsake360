<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>keepsake360 Viewer</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #pano {
        width: 100%;
        height: 100%;
      }
      .message {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 0 24px;
        text-align: center;
      }
      .message h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
      }
      .message p {
        margin: 0;
        max-width: 640px;
        color: #aaa;
        font-size: 14px;
        line-height: 1.5;
        word-break: break-word;
      }
      /* Marzipano pins a hotspot's top-left corner to the projected point and
         forces `display: block` on it, so flexbox centring never applies. Centre
         the circle on the point with negative margins (as Marzipano's sample tour
         does) and centre its icon with absolute positioning instead. */
      .hotspot {
        position: relative;
        box-sizing: border-box;
        width: 24px;
        height: 24px;
        margin: -12px 0 0 -12px;
        padding: 0;
        border: 2px solid #fff;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        cursor: pointer;
      }
      .hotspot-link {
        background: rgba(0, 0, 0, 0.45);
      }
      .hotspot-arrow {
        position: absolute;
        top: 50%;
        left: 50%;
        display: block;
        width: 14px;
        height: 14px;
        /* Negative margins, not a transform: the arrow's rotation is an inline
           transform that would otherwise replace any centring transform. */
        margin: -7px 0 0 -7px;
      }
      .hotspot-arrow svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hotspot-label {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font:
          600 13px/1 system-ui,
          sans-serif;
      }
      .hotspot-info .hotspot-bubble {
        display: none;
      }
      .hotspot-bubble {
        position: absolute;
        bottom: 140%;
        left: 50%;
        width: 220px;
        padding: 8px 10px;
        transform: translateX(-50%);
        border-radius: 8px;
        background: rgba(20, 20, 20, 0.92);
        font:
          400 13px/1.4 system-ui,
          sans-serif;
        text-align: left;
        pointer-events: none;
      }
      .hotspot-info:hover .hotspot-bubble,
      .hotspot-info:focus-visible .hotspot-bubble {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="pano"></div>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
