name: Release Electron App
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION. electron-forge publishes to v<package version>."
            exit 1
          fi
      # One job creates the draft, so the parallel OS builds below only ever
      # upload into an existing release instead of racing to create it.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi

  release:
    needs: draft-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # Forge takes the arch from the CLI rather than packagerConfig, so
            # the macOS build is made universal to cover Intel Macs too.
            forge_args: -- --arch=universal
          - os: ubuntu-latest
            forge_args: ''
          - os: windows-latest
            forge_args: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # maker-rpm needs rpm; maker-deb needs fakeroot and dpkg.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg
      - run: npm ci
      - name: Make and publish
        run: npm run release ${{ matrix.forge_args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
