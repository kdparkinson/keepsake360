name: Release Electron App
on:
  push:
    tags:
      - 'v*'
  # Manual run: builds every platform the same way a tag does but publishes
  # nothing, so the first tagged release is not also the first CI run.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-release:
    # A release only exists for a tag push; a manual run is a dry run.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION. electron-forge publishes to v<package version>."
            exit 1
          fi
      # One job creates the draft, so the parallel OS builds below only ever
      # upload into an existing release instead of racing to create it.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi
      # Put per-OS install instructions above the generated notes, so the asset
      # list isn't just filenames next to GitHub's source archives.
      - name: Add install notes to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          body="$(gh release view "$TAG" --json body -q .body)"
          case "$body" in
            *'## Install'*) echo "Install notes already present." ;;
            *)
              printf '%s\n\n%s\n' "$(cat .github/release-notes.md)" "$body" > "$RUNNER_TEMP/release-body.md"
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-body.md"
              echo "Added install notes to $TAG."
              ;;
          esac

  release:
    needs: draft-release
    # Keep building when draft-release was skipped (manual dry run), but not
    # when it failed or was cancelled.
    if: always() && (needs.draft-release.result == 'success' || needs.draft-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # Forge takes the arch from the CLI rather than packagerConfig, so
            # the macOS build is made universal to cover Intel Macs too.
            forge_args: -- --arch=universal
          - os: windows-latest
            forge_args: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Make and publish
        if: github.event_name == 'push'
        run: npm run release ${{ matrix.forge_args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Dry run: same makers, no publisher, artifacts kept for inspection.
      - name: Make only
        if: github.event_name == 'workflow_dispatch'
        run: npm run make ${{ matrix.forge_args }}
      - name: Upload distributables
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: keepsake360-${{ runner.os }}
          path: out/make/**
          if-no-files-found: error
